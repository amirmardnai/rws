worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log crit;

events {
    worker_connections 32768;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Zero access logging for peak throughput and zero disk I/O locking
    access_log off;

    sendfile on;
    tcp_nopush off;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 300;
    keepalive_requests 1000000;
    reset_timedout_connection on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream rws_xh {
        server 127.0.0.1:18081 max_fails=0;
    }

    upstream rws_ws {
        server 127.0.0.1:18080 max_fails=0;
    }

    upstream rws_grpc {
        server 127.0.0.1:18083 max_fails=0;
    }

    upstream rws_hu {
        server 127.0.0.1:18084 max_fails=0;
    }

    upstream rws_backend {
        server 127.0.0.1:5000 max_fails=0;
        keepalive 32;
    }

    server {
        listen PORT_PLACEHOLDER backlog=16384;
        server_name _;
        client_max_body_size 0;

        # Standard health check for platform deployment orchestrators
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","uptime":"ok"}';
        }

        # Internal Nginx status check
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Multiplexed Stream Transport (XHTTP Chunked Ingress)
        location XHTTP_PATH_PLACEHOLDER {
            proxy_pass http://rws_xh;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # WebSocket Streaming Transport (Persistent 0-RTT Connection)
        location WS_PATH_PLACEHOLDER {
            proxy_pass http://rws_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # gRPC High-Throughput Binary Streaming Transport
        location /GRPC_SERVICE_PLACEHOLDER {
            grpc_pass grpc://rws_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            client_max_body_size 0;
            client_body_buffer_size 512k;
            proxy_buffering off;
        }

        # HTTP Stream Upgrade Transport
        location HU_PATH_PLACEHOLDER {
            proxy_pass http://rws_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Secure telemetry management portal & node configuration export
        location /SECRET_PATH_PLACEHOLDER {
            proxy_pass http://rws_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root & all unmapped routes: Active Camouflage Telemetry Dashboard
        location / {
            proxy_pass http://rws_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}